<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Педант — Нет подключения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #1a1a2e; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px; color: white; }
        .container { text-align: center; max-width: 320px; }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 22px; margin-bottom: 12px; }
        p { font-size: 14px; opacity: 0.7; margin-bottom: 24px; }
        .retry-btn { display: inline-block; padding: 14px 32px; background: #FF6600;
            color: white; text-decoration: none; border-radius: 14px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Нет подключения к интернету</h1>
        <p>Проверьте соединение и попробуйте снова</p>
        <a href="/" class="retry-btn">Попробовать снова</a>
    </div>
</body>
</html>
